<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SKT 26.4Q AI 영상평가 스마트 프롬프터</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800;900&display=swap');
    * {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }
    body {
      background-color: #080c14;
      color: #f3f4f6;
      height: 100vh;
      overflow: hidden;
    }
    .prompter-viewport {
      height: calc(100vh - 215px);
      overflow-y: auto;
      scroll-behavior: smooth;
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .prompter-viewport::-webkit-scrollbar {
      display: none;
    }
    .pulse-record {
      box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7);
      animation: pulse-red 1.6s infinite cubic-bezier(0.66, 0, 0, 1);
    }
    @keyframes pulse-red {
      to { box-shadow: 0 0 0 14px rgba(239, 68, 68, 0); }
    }
    .script-text {
      line-height: 1.85;
      letter-spacing: -0.02em;
      word-break: keep-all;
    }
  </style>
</head>
<body class="flex flex-col select-none">

  <!-- TOP HEADER -->
  <header class="bg-gray-950/90 border-b border-gray-800/80 px-4 py-3 flex items-center justify-between shrink-0 backdrop-blur z-20">
    <div class="flex items-center gap-3">
      <div class="flex items-center gap-2 bg-gray-900 border border-gray-800 px-3 py-1.5 rounded-full">
        <span id="micDot" class="w-3 h-3 rounded-full bg-red-500 pulse-record"></span>
        <span id="micStatusText" class="text-xs font-bold text-gray-200">음성인식 대기</span>
      </div>
      <div class="hidden sm:flex items-center gap-1.5 text-xs text-gray-400">
        <span class="text-indigo-400 font-semibold" id="headerShopInfo">심곡대리점 본점</span>
        <span>•</span>
        <span id="headerCrewInfo">장홍찬 매니저</span>
      </div>
    </div>

    <div class="flex items-center gap-2">
      <div class="flex items-center bg-gray-900 rounded-lg p-1 border border-gray-800">
        <button onclick="adjustFontSize(-2)" class="px-2.5 py-1 text-xs font-bold text-gray-300 hover:text-white rounded active:bg-gray-800">A-</button>
        <span id="fontSizeDisplay" class="text-xs font-mono px-1.5 text-gray-400">26px</span>
        <button onclick="adjustFontSize(2)" class="px-2.5 py-1 text-xs font-bold text-gray-300 hover:text-white rounded active:bg-gray-800">A+</button>
      </div>
      <button onclick="prevStep()" class="px-3 py-1.5 bg-gray-900 hover:bg-gray-800 text-gray-300 text-xs font-semibold rounded-lg border border-gray-800 active:scale-95">이전</button>
      <button onclick="forceNextStep()" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold rounded-lg shadow-lg active:scale-95">수동 넘김</button>
    </div>
  </header>

  <!-- PROGRESS BAR -->
  <div class="w-full bg-gray-900 h-1.5 shrink-0">
    <div id="progressBar" class="bg-gradient-to-r from-indigo-500 via-purple-500 to-emerald-400 h-full w-0 transition-all duration-300"></div>
  </div>

  <!-- MAIN TELEPROMPTER VIEWPORT -->
  <main id="prompterViewport" class="prompter-viewport flex-1 p-4 sm:p-6">
    <div class="max-w-2xl mx-auto space-y-4">
      <div class="bg-gray-900/80 border border-gray-800/90 rounded-2xl p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-2 shadow-lg">
        <div class="flex items-center gap-2.5">
          <span id="stageBadge" class="bg-indigo-500/20 border border-indigo-500/40 text-indigo-300 font-extrabold text-xs px-2.5 py-1 rounded-lg">STAGE 0</span>
          <h2 id="stageTitle" class="text-sm sm:text-base font-bold text-white tracking-tight">본인확인 멘트</h2>
        </div>
        <div class="flex items-center gap-2">
          <span id="stageScore" class="text-xs bg-yellow-500/10 border border-yellow-500/30 text-yellow-300 font-semibold px-2.5 py-0.5 rounded-md">필수 확인</span>
          <span id="accuracyBadge" class="text-xs bg-emerald-500/10 border border-emerald-500/30 text-emerald-300 font-semibold px-2 py-0.5 rounded-md">진행률: 0%</span>
        </div>
      </div>

      <div id="penaltyAlert" class="bg-rose-950/30 border border-rose-800/50 rounded-2xl p-3.5 flex items-start gap-2.5 text-xs text-rose-300">
        <span class="text-rose-400 font-bold shrink-0">⚠ 감점 주의:</span>
        <span id="penaltyText">카메라 렌즈를 정면으로 응시하며 끊김 없이 또박또박 발화하세요.</span>
      </div>

      <div class="bg-gray-900/40 border border-gray-800/60 rounded-3xl p-6 sm:p-8 shadow-2xl relative">
        <div id="scriptContent" class="script-text text-gray-100 font-semibold text-center select-none" style="font-size: 26px;"></div>
        <div id="bottomScrollAnchor" class="h-20"></div>
      </div>
    </div>
  </main>

  <!-- BOTTOM HUD -->
  <footer class="bg-gray-950 border-t border-gray-800/80 p-3 sm:p-4 shrink-0 z-20">
    <div class="max-w-2xl mx-auto space-y-2">
      <div class="flex items-center justify-between text-xs text-gray-400">
        <div class="flex items-center gap-1.5 font-bold text-gray-300">
          <span>🎯 완독 진행 체크</span>
          <span id="keywordCount" class="text-emerald-400">(0 / 4)</span>
        </div>
        <div id="statusNotice" class="text-[11px] text-yellow-400/90 font-medium">마지막 문장까지 끝까지 읽으면 자동으로 넘어갑니다</div>
      </div>

      <div id="keywordBadgeList" class="flex flex-wrap gap-1.5 max-h-14 overflow-y-auto"></div>

      <div class="bg-black/50 border border-gray-800 rounded-xl px-3 py-2 flex items-center justify-between text-xs">
        <span class="text-gray-500 shrink-0 mr-2 font-mono text-[10px]">인식중:</span>
        <span id="liveSttText" class="text-gray-300 truncate font-medium">마이크에 대고 대본을 읽어주세요...</span>
      </div>
    </div>
  </footer>

  <!-- SETUP MODAL -->
  <div id="setupModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-gray-900 border border-gray-800 rounded-3xl p-6 sm:p-8 w-full max-w-md shadow-2xl space-y-5">
      <div class="space-y-1">
        <span class="text-xs font-bold text-indigo-400 tracking-wider uppercase">SK Telecom RP Coach</span>
        <h2 class="text-xl font-extrabold text-white">26.4Q AI 영상평가 준비</h2>
        <p class="text-xs text-gray-400">매장 기본 정보를 입력하면 본인확인 대본에 자동 반영됩니다.</p>
      </div>

      <div class="space-y-3.5 text-sm">
        <div>
          <label class="block text-xs font-bold text-gray-300 mb-1">촬영일자</label>
          <input type="text" id="inputDate" class="w-full bg-gray-950 border border-gray-800 rounded-xl px-3.5 py-2.5 text-white font-medium focus:border-indigo-500 outline-none">
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-300 mb-1">매장코드</label>
          <input type="text" id="inputShopCode" value="D140330000" class="w-full bg-gray-950 border border-gray-800 rounded-xl px-3.5 py-2.5 text-white font-medium focus:border-indigo-500 outline-none">
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-300 mb-1">매장명</label>
          <input type="text" id="inputShopName" value="심곡대리점 본점" class="w-full bg-gray-950 border border-gray-800 rounded-xl px-3.5 py-2.5 text-white font-medium focus:border-indigo-500 outline-none">
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-300 mb-1">T크루 성함</label>
          <input type="text" id="inputCrewName" value="장홍찬 매니저" class="w-full bg-gray-950 border border-gray-800 rounded-xl px-3.5 py-2.5 text-white font-medium focus:border-indigo-500 outline-none">
        </div>
      </div>

      <button onclick="finishSetup()" class="w-full bg-gradient-to-r from-indigo-600 to-blue-600 hover:from-indigo-500 hover:to-blue-500 text-white font-bold py-3.5 rounded-2xl shadow-xl active:scale-98 transition text-sm">
        원테이크 텔레프롬프터 시작
      </button>
    </div>
  </div>

  <audio id="successSfx" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

  <script>
    // 대본과 키워드를 100% 토씨 일치시킨 26.4Q 데이터셋
    const CHECKLIST_DATA = [
      {
        id: 0,
        stageName: "STAGE 0",
        title: "원테이크 본인확인",
        score: "필수 확인",
        penalty: "촬영일/매장코드/매장명/T크루명을 순서대로 명확히 발화해야 합니다.",
        keywords: ["촬영일", "매장코드", "매장명", "롤플레잉", "평가"],
        tailKeywords: ["시작하겠습니다", "시작합니다"],
        template: "촬영일 {date}, 매장코드 {shopCode}, 매장명 {shopName}, T크루 {name} 롤플레잉 평가 시작하겠습니다."
      },
      {
        id: 1,
        stageName: "STAGE 1",
        title: "1-1 & 1-3. 맞이인사 및 내방목적 확인",
        score: "배점 15점",
        penalty: "눈맞춤·기립 인사 실시 필수. 매장명을 명확히 밝히고 고객의 업무 목적을 질문해야 합니다.",
        keywords: ["반갑습니다", "{shopName}", "오늘", "어떤", "업무"],
        tailKeywords: ["도와드릴까요", "드릴까요"],
        template: "반갑습니다! {shopName}입니다. 고객님, 오늘 어떤 업무 도와드릴까요?"
      },
      {
        id: 2,
        stageName: "STAGE 2",
        title: "2-1. 5G 베스트 Max/Pro 4대 특장점 안내",
        score: "배점 30점",
        penalty: "4대 혜택(데이터 완전무제한, 전용혜택 1종, 스마트기기 2회선 요금무료, VIP)을 빠짐없이 설명해야 합니다.",
        keywords: ["베스트", "요금제", "완전무제한", "우주패스", "스마트기기", "무료", "VIP"],
        tailKeywords: ["제공됩니다", "누리실수있습니다", "모두누리실수"],
        template: "고객님께 가장 적합한 5G 베스트 요금제를 안내해 드리겠습니다. 첫째, 데이터는 속도 제한 없이 완전무제한이며, 둘째, 우주패스나 OTT 등 전용 혜택 중 원하시는 1종이 무료 제공됩니다. 셋째, 워치나 태블릿 등 스마트기기 2회선 이용료가 무료이고, 넷째, T멤버십 최고 등급인 VIP 혜택까지 기본으로 모두 누리실 수 있습니다."
      },
      {
        id: 3,
        stageName: "STAGE 3",
        title: "2-2 & 2-3. 요금제 재설계 안내 (실사용 기반)",
        score: "배점 5점 (-5점 감점 방지)",
        penalty: "⚠ '매장에서 대신 변경/자동 변경 처리해 드린다'는 약속 표현은 -5점 감점됩니다. 매장 연락/방문 또는 직접 변경을 유도하세요.",
        keywords: ["6개월", "이용", "매장", "연락", "방문", "패턴분석"],
        tailKeywords: ["재설계해드리겠습니다", "재설계해드릴게요", "재설계"],
        template: "제가 권해드린 요금제로 6개월 동안 충분히 이용해 보신 후, 저희 매장으로 연락 주시거나 방문해 주시면 실제 사용하신 데이터와 혜택 패턴을 분석하여 고객님께 꼭 맞게 재설계해 드리겠습니다."
      },
      {
        id: 4,
        stageName: "STAGE 4",
        title: "2-4 & 3. 추가할인 및 유무선 결합 혜택",
        score: "배점 10점",
        penalty: "SKT 제휴카드/T안심보상 안내 및 인터넷+Btv 유무선 결합 할인 특장점을 명시해야 합니다.",
        keywords: ["제휴카드", "기기값", "추가할인", "요즘가족결합", "인터넷", "Btv"],
        tailKeywords: ["받으실수있습니다", "챙기실수있습니다", "있습니다"],
        template: "추가로 SKT 제휴카드를 함께 활용하시면 기기값 추가 할인을 받으실 수 있습니다. 또한 가족분들이 SKT를 이용 중이시라면 요즘가족결합으로 기가인터넷과 Btv를 결합하여 매월 최대 통신비 할인 혜택을 챙기실 수 있습니다."
      },
      {
        id: 5,
        stageName: "STAGE 5",
        title: "4-1 & 4-2. 배웅인사 및 추가 질문 확인",
        score: "배점 10점",
        penalty: "상담내용 요약 정리, 문자 전송 안내, '더 궁금하신 점' 확인 및 재방문 권유 인사가 필수입니다.",
        keywords: ["요약", "문자", "전송", "궁금하신", "연락", "좋은하루"],
        tailKeywords: ["좋은하루되십시오", "되십시오", "감사합니다"],
        template: "오늘 안내해 드린 요금제와 결합 할인 요약 내용은 문자로 꼼꼼히 전송해 드리겠습니다. 혹시 더 궁금하신 점은 없으실까요? 문의사항이 있으시면 언제든 편하게 매장으로 연락 주십시오. 좋은 하루 되십시오!"
      }
    ];

    let currentStep = 0;
    let baseFontSize = 26;
    let recognition = null;
    let userProfile = { date: '', shopCode: '', shopName: '', name: '' };
    
    // 누적 음성 텍스트 및 상태
    let accumulatedTranscript = '';
    let recognizedKeywords = new Set();
    let isTransitioning = false;
    let isSpeechEngineRunning = false;

    window.addEventListener('DOMContentLoaded', () => {
      const today = new Date();
      const yyyy = today.getFullYear();
      const mm = String(today.getMonth() + 1).padStart(2, '0');
      const dd = String(today.getDate()).padStart(2, '0');
      document.getElementById('inputDate').value = `${yyyy}-${mm}-${dd}`;
    });

    function finishSetup() {
      userProfile.date = document.getElementById('inputDate').value.trim() || '2026-11-05';
      userProfile.shopCode = document.getElementById('inputShopCode').value.trim() || 'D140330000';
      userProfile.shopName = document.getElementById('inputShopName').value.trim() || '심곡대리점 본점';
      userProfile.name = document.getElementById('inputCrewName').value.trim() || '장홍찬 매니저';

      document.getElementById('headerShopInfo').textContent = userProfile.shopName;
      document.getElementById('headerCrewInfo').textContent = userProfile.name;

      document.getElementById('setupModal').classList.add('hidden');
      renderStep(0);
      startSpeechEngine();
    }

    // 단계 전환 (마이크는 끄지 않고 버퍼만 리셋)
    function renderStep(stepIndex) {
      currentStep = stepIndex;
      accumulatedTranscript = ''; // 음성 버퍼 초기화
      recognizedKeywords.clear();
      isTransitioning = false;

      const stage = CHECKLIST_DATA[currentStep];

      document.getElementById('stageBadge').textContent = stage.stageName;
      document.getElementById('stageTitle').textContent = stage.title;
      document.getElementById('stageScore').textContent = stage.score;
      document.getElementById('penaltyText').textContent = stage.penalty;

      const progressPercent = ((currentStep) / (CHECKLIST_DATA.length - 1)) * 100;
      document.getElementById('progressBar').style.width = `${progressPercent}%`;

      const rawText = stage.template
        .replace('{date}', userProfile.date)
        .replace('{shopCode}', userProfile.shopCode)
        .replace(/{shopName}/g, userProfile.shopName)
        .replace('{name}', userProfile.name);

      document.getElementById('scriptContent').textContent = rawText;

      const viewport = document.getElementById('prompterViewport');
      viewport.scrollTop = 0;

      refreshKeywordChips();
    }

    function refreshKeywordChips() {
      const stage = CHECKLIST_DATA[currentStep];
      const container = document.getElementById('keywordBadgeList');
      container.innerHTML = '';

      let matchedCount = 0;

      stage.keywords.forEach(kw => {
        const targetKw = kw.replace('{shopName}', userProfile.shopName);
        const isMatched = recognizedKeywords.has(targetKw);
        if (isMatched) matchedCount++;

        const badge = document.createElement('span');
        badge.className = `px-2 py-0.5 rounded text-[11px] font-semibold transition-colors duration-200 ${
          isMatched
            ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/40'
            : 'bg-gray-900 text-gray-400 border border-gray-800'
        }`;
        badge.textContent = `${isMatched ? '✓ ' : ''}${targetKw}`;
        container.appendChild(badge);
      });

      const totalCount = stage.keywords.length;
      document.getElementById('keywordCount').textContent = `(${matchedCount} / ${totalCount})`;
      
      const percent = Math.min(100, Math.round((matchedCount / totalCount) * 100));
      document.getElementById('accuracyBadge').textContent = `진행률: ${percent}%`;
    }

    function triggerAutoScroll(progressRatio) {
      const viewport = document.getElementById('prompterViewport');
      const maxScroll = viewport.scrollHeight - viewport.clientHeight;
      if (maxScroll <= 0) return;

      if (progressRatio >= 0.3) {
        const targetY = maxScroll * Math.min(1, (progressRatio - 0.2) / 0.7);
        viewport.scrollTo({
          top: targetY,
          behavior: 'smooth'
        });
      }
    }

    // 완독 검증: 문장 종결 + 중간 키워드 매칭
    function evaluateCompletion(fullSpokenText) {
      if (isTransitioning) return;

      const stage = CHECKLIST_DATA[currentStep];
      const cleanSpoken = fullSpokenText.replace(/\s+/g, '');
      const cleanTemplate = stage.template.replace(/\s+/g, '');

      stage.keywords.forEach(kw => {
        const targetKw = kw.replace('{shopName}', userProfile.shopName);
        const cleanKw = targetKw.replace(/\s+/g, '');
        if (cleanSpoken.includes(cleanKw)) {
          recognizedKeywords.add(targetKw);
        }
      });
      refreshKeywordChips();

      const keywordRatio = recognizedKeywords.size / stage.keywords.length;
      const lengthRatio = cleanSpoken.length / cleanTemplate.length;
      const estimatedProgress = Math.max(keywordRatio, Math.min(1, lengthRatio));
      
      triggerAutoScroll(estimatedProgress);

      // 종결 멘트 확인
      const saidTail = stage.tailKeywords.some(tail => cleanSpoken.includes(tail.replace(/\s+/g, '')));

      // 통과 조건: 35% 이상 발화 + 키워드 40% 이상 + 종결 멘트 감지
      if (lengthRatio >= 0.35 && keywordRatio >= 0.4 && saidTail) {
        completeCurrentStep();
      }
    }

    function completeCurrentStep() {
      isTransitioning = true;
      
      try {
        const audio = document.getElementById('successSfx');
        audio.currentTime = 0;
        audio.play().catch(() => {});
      } catch (e) {}

      document.getElementById('statusNotice').textContent = "✔ 완독 확인! 다음 단계로 넘어갑니다";
      document.getElementById('statusNotice').className = "text-[11px] text-emerald-400 font-bold";

      setTimeout(() => {
        document.getElementById('statusNotice').textContent = "마지막 문장까지 끝까지 읽으면 자동으로 넘어갑니다";
        document.getElementById('statusNotice').className = "text-[11px] text-yellow-400/90 font-medium";

        if (currentStep < CHECKLIST_DATA.length - 1) {
          renderStep(currentStep + 1);
        } else {
          alert("🎉 축하합니다! 26.4Q AI 롤플레잉 전 대본 완독을 마쳤습니다.");
        }
      }, 700);
    }

    function prevStep() {
      if (currentStep > 0) renderStep(currentStep - 1);
    }
    function forceNextStep() {
      if (currentStep < CHECKLIST_DATA.length - 1) renderStep(currentStep + 1);
    }

    function adjustFontSize(delta) {
      baseFontSize = Math.min(42, Math.max(18, baseFontSize + delta));
      document.getElementById('scriptContent').style.fontSize = `${baseFontSize}px`;
      document.getElementById('fontSizeDisplay').textContent = `${baseFontSize}px`;
    }

    // 2페이지 이후에도 절대 끊기지 않는 무중단 음성인식 엔진
    function startSpeechEngine() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        document.getElementById('micStatusText').textContent = "STT 미지원 브라우저";
        document.getElementById('micDot').className = "w-3 h-3 rounded-full bg-gray-500";
        return;
      }

      if (recognition) {
        try { recognition.abort(); } catch(e) {}
      }

      recognition = new SpeechRecognition();
      recognition.lang = 'ko-KR';
      recognition.continuous = true;
      recognition.interimResults = true;

      recognition.onstart = () => {
        isSpeechEngineRunning = true;
        document.getElementById('micStatusText').textContent = "실시간 음성인식 ON";
        document.getElementById('micDot').className = "w-3 h-3 rounded-full bg-emerald-500 pulse-record";
      };

      recognition.onerror = (e) => {
        if (e.error !== 'no-speech') {
          console.warn("STT Notice:", e.error);
        }
      };

      // 브라우저가 음성 세션을 임의로 닫아도 0.05초 만에 즉시 부활
      recognition.onend = () => {
        isSpeechEngineRunning = false;
        setTimeout(() => {
          if (!isSpeechEngineRunning) {
            try {
              recognition.start();
            } catch(e) {}
          }
        }, 50);
      };

      recognition.onresult = (event) => {
        let currentInterim = '';
        for (let i = event.resultIndex; i < event.results.length; ++i) {
          const piece = event.results[i][0].transcript;
          if (event.results[i].isFinal) {
            accumulatedTranscript += ' ' + piece;
          } else {
            currentInterim += piece;
          }
        }

        const fullSpoken = (accumulatedTranscript + ' ' + currentInterim).trim();
        if (!fullSpoken) return;

        document.getElementById('liveSttText').textContent = fullSpoken;
        evaluateCompletion(fullSpoken);
      };

      try {
        recognition.start();
      } catch (err) {
        console.error("Mic start err:", err);
      }
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') {
        e.preventDefault();
        forceNextStep();
      } else if (e.key === 'ArrowLeft') {
        prevStep();
      }
    });
  </script>
</body>
</html>
