<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SKT 26.4Q AI 영상평가 스마트 프롬프터</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800;900&display=swap');
    * {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }
    body {
      background-color: #080c14;
      color: #f3f4f6;
      height: 100vh;
      overflow: hidden;
    }
    .prompter-viewport {
      height: calc(100vh - 215px);
      overflow-y: auto;
      scroll-behavior: smooth;
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .prompter-viewport::-webkit-scrollbar {
      display: none;
    }
    .pulse-record {
      box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7);
      animation: pulse-red 1.6s infinite cubic-bezier(0.66, 0, 0, 1);
    }
    @keyframes pulse-red {
      to { box-shadow: 0 0 0 14px rgba(239, 68, 68, 0); }
    }
    .script-text {
      line-height: 1.85;
      letter-spacing: -0.02em;
      word-break: keep-all;
    }
  </style>
</head>
<body class="flex flex-col select-none">

        <span id="micStatusText" class="text-xs font-bold text-gray-200">음성인식 대기</span>
      </button>
      <div class="hidden sm:flex items-center gap-1.5 text-xs text-gray-400">
        <span class="text-indigo-400 font-semibold" id="headerShopInfo">알피대리점 본점</span>
        <span>•</span>
        <span id="headerCrewInfo">김알피 매니저</span>
      </div>
    </div>

    <div class="flex items-center gap-2">
      <div class="flex items-center bg-gray-900 rounded-lg p-1 border border-gray-800">
        <button onclick="adjustFontSize(-2)" class="px-2.5 py-1 text-xs font-bold text-gray-300 hover:text-white rounded active:bg-gray-800">A-</button>
        <span id="fontSizeDisplay" class="text-xs font-mono px-1.5 text-gray-400">26px</span>
        <button onclick="adjustFontSize(2)" class="px-2.5 py-1 text-xs font-bold text-gray-300 hover:text-white rounded active:bg-gray-800">A+</button>

      <button onclick="prevStep()" class="px-3 py-1.5 bg-gray-900 hover:bg-gray-800 text-gray-300 text-xs font-semibold rounded-lg border border-gray-800 active:scale-95">이전</button>

  </header>

  <!-- PROGRESS BAR -->

    <div id="progressBar" class="bg-gradient-to-r from-indigo-500 via-purple-500 to-emerald-400 h-full w-0 transition-all duration-300"></div>
  </div>

  <!-- MAIN TELEPROMPTER VIEWPORT -->
  <main id="prompterViewport" class="prompter-viewport flex-1 p-4 sm:p-6">
    <div class="max-w-2xl mx-auto space-y-4">
      <div class="bg-gray-900/80 border border-gray-800/90 rounded-2xl p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-2 shadow-lg">

  <script>
    const CHECKLIST_DATA = [

        score: "필수 확인",

      {

        penalty: "눈맞춤·기립 인사 실시 필수. 매장명을 명확히 밝히고 고객의 업무 목적을 질문해야 합니다.",
        keywords: ["반갑습니다", "{shopName}", "오늘", "어떤", "업무"],
        tailKeywords: ["도와드릴까요", "드릴까요"],
        template: "반갑습니다! {shopName}입니다. 고객님, 오늘 어떤 업무 도와드릴까요?"
      },
      {
        id: 2,
        stageName: "STAGE 2",
        title: "2-1. 5G 베스트 Max/Pro 4대 특장점 안내",
        score: "배점 30점",
        penalty: "4대 혜택(데이터 완전무제한, 전용혜택 1종, 스마트기기 2회선 요금무료, VIP)을 빠짐없이 설명해야 합니다.",
        keywords: ["베스트", "요금제", "완전무제한", "우주패스", "스마트기기", "무료", "VIP"],
        tailKeywords: ["제공됩니다", "누리실수있습니다", "모두누리실수"],
        template: "고객님께 가장 적합한 5G 베스트 요금제를 안내해 드리겠습니다. 첫째, 데이터는 속도 제한 없이 완전무제한이며, 둘째, 우주패스나 OTT 등 전용 혜택 중 원하시는 1종이 무료 제공됩니다. 셋째, 워치나 태블릿 등 스마트기기 2회선 이용료가 무료이고, 넷째, T멤버십 최고 등급인 VIP 혜택까지 기본으로 모두 누리실 수 있습니다."
      },
      {
        id: 3,

        penalty: "⚠ '매장에서 대신 변경/자동 변경 처리해 드린다'는 약속 표현은 -5점 감점됩니다. 매장 연락/방문 또는 직접 변경을 유도하세요.",
        keywords: ["6개월", "이용", "매장", "연락", "방문", "패턴분석"],
        tailKeywords: ["재설계해드리겠습니다", "재설계해드릴게요", "재설계"],
        template: "제가 권해드린 요금제로 6개월 동안 충분히 이용해 보신 후, 저희 매장으로 연락 주시거나 방문해 주시면 실제 사용하신 데이터와 혜택 패턴을 분석하여 고객님께 꼭 맞게 재설계해 드리겠습니다."
      },
      {
        id: 4,
        stageName: "STAGE 4",
        title: "2-4 & 3. 추가할인 및 유무선 결합 혜택",
        score: "배점 10점",
        penalty: "SKT 제휴카드/T안심보상 안내 및 인터넷+Btv 유무선 결합 할인 특장점을 명시해야 합니다.",
        keywords: ["제휴카드", "기기값", "추가할인", "요즘가족결합", "인터넷", "Btv"],
        tailKeywords: ["받으실수있습니다", "챙기실수있습니다", "있습니다"],
        template: "추가로 SKT 제휴카드를 함께 활용하시면 기기값 추가 할인을 받으실 수 있습니다. 또한 가족분들이 SKT를 이용 중이시라면 요즘가족결합으로 기가인터넷과 Btv를 결합하여 매월 최대 통신비 할인 혜택을 챙기실 수 있습니다."
      },
      {
        id: 5,
        stageName: "STAGE 5",
        title: "4-1 & 4-2. 배웅인사 및 추가 질문 확인",
        score: "배점 10점",
        penalty: "상담내용 요약 정리, 문자 전송 안내, '더 궁금하신 점' 확인 및 재방문 권유 인사가 필수입니다.",
        keywords: ["요약", "문자", "전송", "궁금하신", "연락", "좋은하루"],
        tailKeywords: ["좋은하루되십시오", "되십시오", "감사합니다"],
        template: "오늘 안내해 드린 요금제와 결합 할인 요약 내용은 문자로 꼼꼼히 전송해 드리겠습니다. 혹시 더 궁금하신 점은 없으실까요? 문의사항이 있으시면 언제든 편하게 매장으로 연락 주십시오. 좋은 하루 되십시오!"
      }
    ];

    let currentStep = 0;
    let baseFontSize = 26;
    let recognition = null;
    let userProfile = { date: '', shopCode: '', shopName: '', name: '' };
    
    let accumulatedTranscript = '';
    let recognizedKeywords = new Set();
    let isTransitioning = false;
    let isSpeechEngineRunning = false;
    let shouldBeRecognizing = false;
    let stepStartTime = 0;
    let resultBoundary = 0; // 현재 단계 시작 전에 생성된 STT 결과 수
    let latestResultCount = 0;
    let processedFinalResults = new Set(); // 같은 final 결과의 중복 누적 방지
    let stageFinalTranscript = '';
    let stageInterimTranscript = '';
    let restartTimer = null;
    let transitionTimer = null;
    let micPermissionBlocked = false;
    let lastFinalIndex = -1;        // 마지막으로 확정된 문장 번호
    let nextStageBoundary = null;   // 자동 넘김 시 다음 페이지가 시작될 문장 번호
    let lastResultEvent = null;     // 전환 중 들어온 음성 결과를 다시 읽기 위해 보관
    const MIN_STAGE_TIME_MS = 1000;

    const normalizeSpeech = text => String(text || '')
      .toLowerCase().replace(/[^가-힣0-9a-z]/g, '');

    // STT에서 자주 발생하는 띄어쓰기/발음 변형을 허용하되 필수 의미 단위는 유지
    const KEYWORD_ALIASES = {
      '반갑습니다': ['반갑습니다', '방갑습니다', '반갑'],
      '완전무제한': ['완전무제한', '완전 무제한', '완전 무제한입니다'],
      '우주패스': ['우주패스', '우주 패스'],
      '요즘가족결합': ['요즘가족결합', '요즘 가족 결합'],
      '패턴분석': ['패턴분석', '패턴을분석', '패턴 분석'],
      '추가할인': ['추가할인', '추가 할인'],
      '좋은하루': ['좋은하루', '좋은 하루'],
      'Btv': ['btv', '비티비', '비티브이'],
      'VIP': ['vip', '브이아이피']
    };

    // 영문 알파벳을 한글 발음으로 변환 (RP → 알피, btv → 비티브이)
    const LETTER_READINGS = {
      a: '에이', b: '비', c: '씨', d: '디', e: '이', f: '에프', g: '지',
      h: '에이치', i: '아이', j: '제이', k: '케이', l: '엘', m: '엠', n: '엔',
      o: '오', p: '피', q: '큐', r: '알', s: '에스', t: '티', u: '유',
      v: '브이', w: '더블유', x: '엑스', y: '와이', z: '지'
    };
    function toPhonetic(text) {
      return normalizeSpeech(text).replace(/[a-z]/g, ch => LETTER_READINGS[ch] || ch);
    }

    // 두 문자열이 몇 글자 다른지 계산 (추가/삭제/변경 1회 = 1)
    function editDistance(a, b) {
      const dp = Array.from({ length: a.length + 1 }, (_, i) => [i]);
      for (let j = 1; j <= b.length; j++) dp[0][j] = j;
      for (let i = 1; i <= a.length; i++) {
        for (let j = 1; j <= b.length; j++) {
          dp[i][j] = Math.min(
            dp[i - 1][j] + 1,
            dp[i][j - 1] + 1,
            dp[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)
          );
        }
      }
      return dp[a.length][b.length];
    }

    // 매장코드: 발화 속 숫자 덩어리가 실제 코드와 1자리 이내로 다르면 인정
    function shopCodeFuzzyMatch(spoken) {
      const digits = String(userProfile.shopCode || '').replace(/[^0-9]/g, '');
      if (digits.length < 6) return false; // 짧은 코드는 오인식 위험이 있어 제외
      const runs = spoken.match(/[0-9]+/g) || [];
      return runs.some(run =>
        Math.abs(run.length - digits.length) <= 1 && editDistance(run, digits) <= 1
      );
    }

    // text 안에 pattern과 비슷한 부분이 있는지 확인 (maxErr 글자까지 다름 허용)
    function fuzzyContains(text, pattern, maxErr) {
      if (!pattern) return false;
      if (text.includes(pattern)) return true;
      let prev = new Array(text.length + 1).fill(0); // 시작 위치 자유
      for (let i = 1; i <= pattern.length; i++) {
        const cur = [i];
        for (let j = 1; j <= text.length; j++) {
          cur[j] = Math.min(
            prev[j] + 1,
            cur[j - 1] + 1,
            prev[j - 1] + (pattern[i - 1] === text[j - 1] ? 0 : 1)
          );
        }
        prev = cur;
      }
      return Math.min(...prev) <= maxErr;
    }

    // 날짜 입력값(예: 2026-11-09)을 STT가 받아 적을 수 있는 형태로 변환
    function buildDateVariants(dateStr) {
      const d = String(dateStr || '').replace(/[^0-9]/g, '');
      if (d.length !== 8) return [dateStr];
      const y = d.slice(0, 4), m = d.slice(4, 6), dd = d.slice(6, 8);
      const mi = String(Number(m)), di = String(Number(dd));
      return [
        d,                          // 20261109
        `${y}년${mi}월${di}일`,      // 2026년11월9일
        `${mi}월${di}일`,            // 11월9일
        `${m}월${dd}일`,             // 11월09일
        `${mi}월${di}`               // 11월9 ('일' 누락 대비)
      ];
    }

    // 숫자를 한 자리씩 읽었을 때 STT가 한글로 적는 경우 대비 (0 → 공/영)
    function buildDigitReadings(digits) {
      const base = ['', '일', '이', '삼', '사', '오', '육', '칠', '팔', '구'];
      const toKor = zero => digits.split('').map(n => n === '0' ? zero : base[Number(n)]).join('');
      return [toKor('공'), toKor('영')];
    }

    // 값 기반 키워드: 라벨이 아니라 실제 입력값이 발화됐는지로만 판정
    function getValueVariants(keyword) {
      switch (keyword) {
        case '촬영일':
          return buildDateVariants(userProfile.date);
        case '매장코드': {
          const code = String(userProfile.shopCode || '');
          const digits = code.replace(/[^0-9]/g, '');
          return digits.length >= 4
            ? [code, digits, ...buildDigitReadings(digits)]
            : [code];
        }
        case '매장명':
          return [userProfile.shopName];
        case 'T크루명': {
          const firstWord = String(userProfile.name || '').trim().split(/\s+/)[0];
          return [userProfile.name, firstWord];
        }
        default:
          return null; // 값 기반 키워드가 아님
      }
    }

    function hasKeyword(spoken, keyword) {
      const target = keyword.replace('{shopName}', userProfile.shopName);
      // 매장코드는 숫자 1자리 오차까지 허용
      if (target === '매장코드' && shopCodeFuzzyMatch(spoken)) return true;

      const valueVariants = getValueVariants(target);
      // 값 기반 키워드는 실제 값만, 그 외 키워드는 기존 별칭 방식 유지
      const variants = valueVariants || KEYWORD_ALIASES[target] || [target];
      const spokenPhonetic = toPhonetic(spoken);
      const exact = variants.some(value => {
        const v = normalizeSpeech(value);
        if (!v) return false;
        // 원문 그대로 일치하거나, 영문을 한글 발음으로 바꿔서 일치하면 인정
        return spoken.includes(v) || spokenPhonetic.includes(toPhonetic(v));
      });
      if (exact) return true;

      // 매장명·T크루명(STAGE 1의 매장명 포함)은 6글자당 1글자 오차 허용 (앤/엔, 애/에 등)
      const isNameLike = target === '매장명' || target === 'T크루명' || target === userProfile.shopName;
      if (isNameLike) {
        const base = target === 'T크루명' ? userProfile.name
                   : userProfile.shopName;
        const v = toPhonetic(base);
        const maxErr = Math.floor(v.length / 6);
        if (maxErr > 0 && fuzzyContains(spokenPhonetic, v, maxErr)) return true;
      }
      return false;
    }

    // 단순 글자 수만으로 자동 넘김하지 않음. 단계별 핵심 발화가 모두 필요함.
    const REQUIRED_GROUPS = {
      0: [['촬영일'], ['매장코드'], ['매장명'], ['T크루명']],
      1: [['반갑습니다'], ['{shopName}'], ['오늘'], ['어떤'], ['업무'], ['도와드릴까요', '드릴까요']],
      2: [['베스트'], ['완전무제한'], ['우주패스', '전용혜택'], ['스마트기기'], ['무료'], ['VIP']],
      3: [['6개월'], ['이용'], ['매장'], ['연락', '방문'], ['패턴분석'], ['재설계']],
      4: [['제휴카드'], ['기기값'], ['추가할인'], ['요즘가족결합'], ['인터넷'], ['Btv']],
      5: [['요약'], ['문자'], ['전송'], ['궁금하신'], ['연락'], ['좋은하루']]
    };
    const END_PHRASES = {
      0: ['평가시작하겠습니다', '평가시작합니다'],
      1: ['업무도와드릴까요', '도와드릴까요', '드릴까요'],
      2: ['모두누리실수있습니다', '누리실수있습니다'],
      3: ['재설계해드리겠습니다', '재설계해드릴게요'],
      4: ['챙기실수있습니다', '할인혜택을챙기실수있습니다'],
      5: ['좋은하루되십시오', '좋은하루되세요']
    };

    // 촬영일자 칸에 오늘 날짜 채우기 (force=true면 기존 값이 있어도 덮어씀)
    function setTodayDate(force = false) {
      const today = new Date();
      const yyyy = today.getFullYear();
      const mm = String(today.getMonth() + 1).padStart(2, '0');
      const dd = String(today.getDate()).padStart(2, '0');
      const todayStr = `${yyyy}-${mm}-${dd}`;
      const targetInput = document.getElementById('inputDate');
      if (!targetInput) return;
      targetInput.placeholder = todayStr;
      if (force || !targetInput.value.trim()) {
        targetInput.value = todayStr;
      }
    }
    // 페이지가 열릴 때 바로 실행 + 브라우저가 이전 입력 상태를 복원한 뒤에도 다시 확인
    setTodayDate();
    document.addEventListener('DOMContentLoaded', () => setTodayDate());
    window.addEventListener('pageshow', () => setTodayDate());

    // [다시 시작] 버튼: HTML 수정 없이 헤더 '이전' 버튼 앞에 동적으로 삽입
    function createRestartButton() {
      if (document.getElementById('restartBtn')) return;
      const prevBtn = document.querySelector('button[onclick="prevStep()"]');
      if (!prevBtn) return;
      const btn = document.createElement('button');
      btn.id = 'restartBtn';
      btn.type = 'button';
      btn.textContent = '다시 시작';
      btn.className = 'hidden px-3 py-1.5 bg-rose-600 hover:bg-rose-500 text-white text-xs font-bold rounded-lg border border-rose-500 active:scale-95';
      btn.addEventListener('click', restartApp);
      prevBtn.parentNode.insertBefore(btn, prevBtn);
    }

    // 원테이크 재촬영: 입력 정보는 유지하고 1페이지(본인확인)부터 바로 다시 시작
    function restartApp() {
      if (restartTimer) { clearTimeout(restartTimer); restartTimer = null; }
      if (transitionTimer) { clearTimeout(transitionTimer); transitionTimer = null; }
      isTransitioning = false;
      micPermissionBlocked = false;
      shouldBeRecognizing = true;

      // 음성인식을 깨끗하게 새로 켜기 (끝나면 onend에서 자동 재시작)
      if (recognition && isSpeechEngineRunning) {
        try { recognition.abort(); } catch (e) {}
      }
      latestResultCount = 0;
      renderStep(0);
      if (!isSpeechEngineRunning) startSpeechEngine();
    }

    createRestartButton();

    // 설정 화면 매장명 입력란 안내: 한글 입력 권장 + 예시
    function setupShopNameHint() {
      const input = document.getElementById('inputShopName');
      if (!input) return;
      const label = input.previousElementSibling;
      if (label && label.tagName === 'LABEL') {
        label.innerHTML = '매장명 <span class="text-yellow-400 font-semibold">(한글로 작성하세요! 예: 유엔아이대리점 송도아울렛점)</span>';
      }
      input.placeholder = '예: 유엔아이대리점 송도아울렛점';
    }
    setupShopNameHint();

    // 설정 화면 T크루 성함 입력란: 이름만 입력하도록 안내 (직급 제외)
    function setupCrewNameHint() {
      const input = document.getElementById('inputCrewName');
      if (!input) return;
      const label = input.previousElementSibling;
      if (label && label.tagName === 'LABEL') {
        label.innerHTML = 'T크루 성함 <span class="text-yellow-400 font-semibold">(이름만 입력하세요! 예: 김알피)</span>';
      }
      input.placeholder = '예: 김알피';
      if (input.value.trim() === '김알피 매니저') input.value = '김알피';
    }
    setupCrewNameHint();

    async function finishSetup() {
      const today = new Date();
      const yyyy = today.getFullYear();
      const mm = String(today.getMonth() + 1).padStart(2, '0');
      const dd = String(today.getDate()).padStart(2, '0');
      const fallbackDate = `${yyyy}-${mm}-${dd}`;

      userProfile.date = (document.getElementById('inputDate').value.trim()) || fallbackDate;
      userProfile.shopCode = document.getElementById('inputShopCode').value.trim() || 'D123450000';
      userProfile.shopName = document.getElementById('inputShopName').value.trim() || '알피대리점 본점';
      userProfile.name = document.getElementById('inputCrewName').value.trim() || '김알피';

      document.getElementById('headerShopInfo').textContent = userProfile.shopName;
      document.getElementById('headerCrewInfo').textContent = userProfile.name;

      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          stream.getTracks().forEach(track => track.stop());
        } catch (err) {
          console.warn("마이크 권한 알림:", err);
        }
      }

      document.getElementById('setupModal').classList.add('hidden');
      renderStep(0);
      shouldBeRecognizing = true;
      startSpeechEngine();
    }

    function renderStep(stepIndex) {
      if (transitionTimer) { clearTimeout(transitionTimer); transitionTimer = null; }
      currentStep = stepIndex;
      accumulatedTranscript = '';
      recognizedKeywords.clear();
      isTransitioning = false;
      stepStartTime = Date.now();
      // 자동 넘김이면 넘김을 확정한 문장 바로 다음부터, 수동 넘김이면 지금까지 결과 이후부터 새 페이지로 인정
      resultBoundary = (nextStageBoundary !== null) ? nextStageBoundary : latestResultCount;
      nextStageBoundary = null;
      stageFinalTranscript = '';
      stageInterimTranscript = '';
      processedFinalResults.clear();

      document.getElementById('statusNotice').textContent = '마지막 문장까지 끝까지 읽으면 자동으로 넘어갑니다';
      document.getElementById('statusNotice').className = 'text-[11px] text-yellow-400/90 font-medium';
      const liveTextEl = document.getElementById('liveSttText');
      if (liveTextEl) liveTextEl.textContent = "새 멘트를 읽어주세요...";

      const stage = CHECKLIST_DATA[currentStep];

      document.getElementById('stageBadge').textContent = stage.stageName;
      document.getElementById('stageTitle').textContent = stage.title;
      document.getElementById('stageScore').textContent = stage.score;
      document.getElementById('penaltyText').textContent = stage.penalty;

      const progressPercent = ((currentStep) / (CHECKLIST_DATA.length - 1)) * 100;
      document.getElementById('progressBar').style.width = `${progressPercent}%`;

      const rawText = stage.template
        .replace('{date}', userProfile.date)
        .replace('{shopCode}', userProfile.shopCode)
        .replace(/{shopName}/g, userProfile.shopName)
        .replace('{name}', userProfile.name);

      document.getElementById('scriptContent').textContent = rawText;

      const viewport = document.getElementById('prompterViewport');
      viewport.scrollTop = 0;

      const restartBtn = document.getElementById('restartBtn');
      if (restartBtn) restartBtn.classList.toggle('hidden', stepIndex !== 1);

      refreshKeywordChips();
    }

    function refreshKeywordChips() {
      const stage = CHECKLIST_DATA[currentStep];
      const container = document.getElementById('keywordBadgeList');
      container.innerHTML = '';

      let matchedCount = 0;

      stage.keywords.forEach(kw => {
        const targetKw = kw.replace('{shopName}', userProfile.shopName);
        const isMatched = recognizedKeywords.has(targetKw);
        if (isMatched) matchedCount++;

        const badge = document.createElement('span');
        badge.className = `px-2 py-0.5 rounded text-[11px] font-semibold transition-colors duration-200 ${
          isMatched
            ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/40'
            : 'bg-gray-900 text-gray-400 border border-gray-800'
        }`;
        badge.textContent = `${isMatched ? '✓ ' : ''}${targetKw}`;
        container.appendChild(badge);
      });

      const totalCount = stage.keywords.length;
      document.getElementById('keywordCount').textContent = `(${matchedCount} / ${totalCount})`;
      
      const percent = Math.min(100, Math.round((matchedCount / totalCount) * 100));
      document.getElementById('accuracyBadge').textContent = `진행률: ${percent}%`;
    }

    function triggerAutoScroll(progressRatio) {
      const viewport = document.getElementById('prompterViewport');
      const maxScroll = viewport.scrollHeight - viewport.clientHeight;
      if (maxScroll <= 0) return;

      if (progressRatio >= 0.15) {
        const scrollFactor = Math.min(1, (progressRatio - 0.15) / 0.7);
        const targetY = maxScroll * scrollFactor;
        viewport.scrollTo({
          top: targetY,
          behavior: 'smooth'
        });
      }
    }

    function evaluateCompletion(fullSpokenText, isFinalUpdate = false) {
      if (isTransitioning) return;
      const stage = CHECKLIST_DATA[currentStep];
      const spoken = normalizeSpeech(fullSpokenText);
      if (!spoken) return;

      stage.keywords.forEach(kw => {
        const display = kw.replace('{shopName}', userProfile.shopName);
        if (hasKeyword(spoken, kw)) recognizedKeywords.add(display);
      });
      refreshKeywordChips();

      // 스크롤은 임시 결과도 사용하지만, 자동 넘김은 확정(final) 결과만 사용
      const template = stage.template
        .replace('{date}', userProfile.date)
        .replace('{shopCode}', userProfile.shopCode)
        .replace(/{shopName}/g, userProfile.shopName)
        .replace('{name}', userProfile.name);
      const templateLength = normalizeSpeech(template).length;
      const lengthRatio = templateLength ? spoken.length / templateLength : 0;
      const keywordRatio = recognizedKeywords.size / Math.max(1, stage.keywords.length);
      triggerAutoScroll(Math.min(1, Math.max(keywordRatio, Math.min(1, lengthRatio))));

      if (!isFinalUpdate || Date.now() - stepStartTime < MIN_STAGE_TIME_MS) return;

      const groups = REQUIRED_GROUPS[stage.id] || [];
      const allRequired = groups.every(group => group.some(kw => hasKeyword(spoken, kw)));
      const endings = END_PHRASES[stage.id] || [];
      // 꼬리말이 실제 발화 끝부분에 있어야 하며, 중간에 언급된 표현은 인정하지 않음
      const endMatched = endings.some(ending => spoken.endsWith(normalizeSpeech(ending)));
      // 단순 길이 95% 예외를 삭제하여 무관한 발화로 넘어가는 오류 방지
      if (allRequired && endMatched && lengthRatio >= 0.55) {
        completeCurrentStep();
      }
    }

    function completeCurrentStep() {
      isTransitioning = true;
      // 넘김을 확정한 문장 다음 번호부터는 다음 페이지 발화로 처리
      nextStageBoundary = lastFinalIndex + 1;

      try {
        const audio = document.getElementById('successSfx');
        audio.currentTime = 0;
        audio.play().catch(() => {});
      } catch (e) {}

      document.getElementById('statusNotice').textContent = "✔ 완독 확인! 다음 단계로 넘어갑니다";
      document.getElementById('statusNotice').className = "text-[11px] text-emerald-400 font-bold";

      transitionTimer = setTimeout(() => {
        transitionTimer = null;
        document.getElementById('statusNotice').textContent = "마지막 문장까지 끝까지 읽으면 자동으로 넘어갑니다";
        document.getElementById('statusNotice').className = "text-[11px] text-yellow-400/90 font-medium";

        if (currentStep < CHECKLIST_DATA.length - 1) {
          renderStep(currentStep + 1);
          // 전환 중에 이미 들어온 말("반갑습니다" 등)을 새 페이지에 바로 반영
          if (lastResultEvent) handleSpeechResult(lastResultEvent);
        } else {
          alert("🎉 축하합니다! 26.4Q AI 롤플레잉 전 대본 완독을 마쳤습니다.");
        }
      }, 400);
    }

    function prevStep() {
      if (currentStep > 0) renderStep(currentStep - 1);
    }
    function forceNextStep() {
      if (currentStep < CHECKLIST_DATA.length - 1) renderStep(currentStep + 1);
    }

    function adjustFontSize(delta) {
      baseFontSize = Math.min(42, Math.max(18, baseFontSize + delta));
      document.getElementById('scriptContent').style.fontSize = `${baseFontSize}px`;
      document.getElementById('fontSizeDisplay').textContent = `${baseFontSize}px`;
    }


    // 음성인식 결과 처리 (전환 직후 다시 호출할 수 있도록 함수로 분리)
    function handleSpeechResult(event) {
      latestResultCount = Math.max(latestResultCount, event.results.length);
      lastResultEvent = event;
      if (isTransitioning) return; // 전환 중에는 보관만 하고, 전환 끝나면 다시 읽음
      let interim = '';
      let addedFinal = false;
      for (let i = resultBoundary; i < event.results.length; i++) {
        const result = event.results[i];
        const piece = result[0].transcript;
        if (result.isFinal) {
          if (!processedFinalResults.has(i)) {
            processedFinalResults.add(i);
            stageFinalTranscript += ' ' + piece;
            lastFinalIndex = Math.max(lastFinalIndex, i);
            addedFinal = true;
          }
        } else {
          interim += ' ' + piece;
        }
      }
      stageInterimTranscript = interim;
      const spoken = (stageFinalTranscript + ' ' + stageInterimTranscript).trim();
      if (!spoken) return;
      document.getElementById('liveSttText').textContent = spoken;
      evaluateCompletion(spoken, false);
      if (addedFinal) evaluateCompletion(stageFinalTranscript, true);
    }

    function startSpeechEngine() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        document.getElementById('micStatusText').textContent = 'STT 미지원 브라우저';
        document.getElementById('micDot').className = 'w-3 h-3 rounded-full bg-gray-500';
        return;
      }
      if (micPermissionBlocked || isSpeechEngineRunning) return;
      if (restartTimer) { clearTimeout(restartTimer); restartTimer = null; }
      if (!recognition) {
        recognition = new SpeechRecognition();
        recognition.lang = 'ko-KR';
        recognition.continuous = true;
        recognition.interimResults = true;
        recognition.maxAlternatives = 1;

        recognition.onstart = () => {
          isSpeechEngineRunning = true;
          // 음성인식이 다시 켜지면 번호표가 0부터 새로 시작되므로 기억도 초기화
          // (이 페이지에서 이미 인식된 문장은 그대로 유지)
          latestResultCount = 0;
          resultBoundary = 0;
          processedFinalResults.clear();
          stageInterimTranscript = '';
          lastFinalIndex = -1;
          nextStageBoundary = null;
          lastResultEvent = null;
          document.getElementById('micStatusText').textContent = '실시간 음성인식 ON';
          document.getElementById('micDot').className = 'w-3 h-3 rounded-full bg-emerald-500 pulse-record';
        };
        recognition.onerror = e => {
          if (e.error !== 'no-speech') console.warn('STT 상태:', e.error);
          if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
            micPermissionBlocked = true;
            shouldBeRecognizing = false;
            document.getElementById('micStatusText').textContent = '마이크 권한 필요(터치)';
            document.getElementById('micDot').className = 'w-3 h-3 rounded-full bg-yellow-500';
          }
        };
        recognition.onend = () => {
          isSpeechEngineRunning = false;
          // STT 세션이 실제 종료될 때만 재시작 (단계 전환 시에는 유지)
          if (shouldBeRecognizing && !micPermissionBlocked) {
            restartTimer = setTimeout(() => {
              restartTimer = null;
              startSpeechEngine();
            }, 350);
          } else {
            document.getElementById('micStatusText').textContent = '음성인식 대기';
            document.getElementById('micDot').className = 'w-3 h-3 rounded-full bg-red-500';
          }
        };
        recognition.onresult = handleSpeechResult;
      }
      try { recognition.start(); }
      catch (err) {
        // 이미 시작 중인 경우에는 다음 onstart/onend를 기다림
        if (err.name !== 'InvalidStateError') console.warn('마이크 시작:', err);
      }
    }

    function manualToggleMic() {
      micPermissionBlocked = false;
      shouldBeRecognizing = true;
      startSpeechEngine();
    }

    window.addEventListener('keydown', (e) => {
      // 입력창에서 타이핑 중이거나 설정 화면이 열려 있으면 단축키 무시 (띄어쓰기·커서 이동 허용)
      const tag = (e.target && e.target.tagName) || '';
      const isTyping = tag === 'INPUT' || tag === 'TEXTAREA' || (e.target && e.target.isContentEditable);
      const setupOpen = !document.getElementById('setupModal').classList.contains('hidden');
      if (isTyping || setupOpen) return;

      if (e.key === 'ArrowRight' || e.key === ' ') {
        e.preventDefault();
        forceNextStep();
      } else if (e.key === 'ArrowLeft') {
        prevStep();
      }
    });
  </script>
</body>
</html>
